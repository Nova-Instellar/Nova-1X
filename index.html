<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Fainder - Welcome</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; /* テキスト選択不可 */
        }
        #gate-container {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }
        .logo-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #333, #111);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #444;
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }
        h1 { font-weight: 300; letter-spacing: 5px; margin-bottom: 30px; }
        .launch-btn {
            background: none;
            border: 1px solid #666;
            color: #ccc;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            z-index: 10;
        }
        .launch-btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        /* ボット用トラップ（画面外へ飛ばして完全隠蔽） */
        .bot-trap {
            position: absolute !important;
            left: -9999px !important;
            top: -9999px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="gate-container">
        <div class="logo-circle">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=80" style="width:60px; border-radius:10px;" alt="Logo">
        </div>
        <h1>FAINDER</h1>
        
        <!-- ボットトラップ領域 -->
        <div class="bot-trap" aria-hidden="true">
            <input type="text" id="trap_input" name="website_url_check" tabindex="-1" autocomplete="off">
            <input type="checkbox" id="trap_checkbox" name="agree_terms_check" tabindex="-1">
        </div>

        <button class="launch-btn" onclick="secureLaunch()">Fainderを起動する</button>
    </div>

    <script>
        const loadTime = Date.now();
        let isHumanInteraction = false;

        // 人間特有の操作（マウス移動またはタッチ操作）を検知
        function markAsHuman() {
            isHumanInteraction = true;
            window.removeEventListener('mousemove', markAsHuman);
            window.removeEventListener('touchstart', markAsHuman);
        }
        window.addEventListener('mousemove', markAsHuman);
        window.addEventListener('touchstart', markAsHuman);

        // 1. 起動処理（ボット対策のみ実施して直接遷移）
        function secureLaunch() {
            const trapInput = document.getElementById('trap_input').value;
            const trapCheckbox = document.getElementById('trap_checkbox').checked;
            const clickTime = Date.now() - loadTime;

            // ボット判定条件:
            // - ハニーポットへの入力・操作がある
            // - 読み込みから1秒未満（1000ms）のアクセス
            // - 人間らしい操作（マウス・タッチ）が一度も発生していない
            if (trapInput !== "" || trapCheckbox || clickTime < 1000 || !isHumanInteraction) {
                console.warn("Access Denied.");
                return;
            }

            // 遷移先の動的生成（そのまま index2.html へ遷移）
            const target = ['index', '2', '.', 'h', 't', 'm', 'l'].join('');
            location.href = target;
        }

        // 2. コンソールガード（ショートカット禁止）
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) ||
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        // 3. 無限デバッガー
        setInterval(function() {
            (function() {
                (function a() {
                    try {
                        (function b(i) {
                            if (('' + (i / i)).length !== 1 || i % 20 === 0) {
                                (function() {}).constructor('debugger')();
                            } else {
                                debugger;
                            }
                            b(++i);
                        })(0);
                    } catch (e) {
                        setTimeout(a, 50);
                    }
                })();
            })();
        }, 1000);

        // 4. コンソールを常にクリア
        setInterval(() => {
            console.clear();
        }, 500);
    </script>
</body>
</html>
